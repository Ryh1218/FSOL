port: 22222
random_seed: 1234

files:
  gt_files_folder: ../../data/PUCPR+_devkit


dataset:
  type: custom_exemplar
  img_dir: &img_dir ../../data/PUCPR+_devkit/Images/
  density_dir: ../../data/PUCPR+_devkit/gt_density_map/
  exemplar:
    img_dir: *img_dir
    meta_file: ../../data/PUCPR+_devkit/exemplar.json
    norm: true
    num_exemplar: 5
  input_size: [512, 512] # [h, w]
  pixel_mean: [0.485, 0.456, 0.406]
  pixel_std: [0.229, 0.224, 0.225]
  batch_size: 1
  workers: 4

  train:
    meta_file: ../../data/PUCPR+_devkit/train.json
    hflip: false
    vflip: false
    rotate: false
    colorjitter:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      hue: 0.1
      prob: 0.5
    gamma:
      range: [0.75, 1.5]
      prob: 0.5
  val:
    meta_file: ../../data/PUCPR+_devkit/test.json
  test:
    meta_file: ../../data/PUCPR+_devkit/test.json

criterion:
  - name: _MSELoss
    type: _MSELoss
    kwargs:
      outstride: 1
      weight: 250

trainer:
  epochs: 200
  lr_scale_backbone: 0 # 0: frozen, 0.1: 0.1 * lr, 1: lr
  optimizer:
    type: Adam
    kwargs:
      lr: 0.00002
  lr_scheduler:
    type: StepLR
    kwargs:
      step_size: 200
      gamma: 0.25

saver:
  ifload: false
  load_weight: FSOL.pth
  save_dir: checkpoints/
  log_dir: log/

visualizer:
  ifvis: false
  vis_dir: vis/
  img_dir: *img_dir
  activation: sigmoid # [null, sigmoid]
  normalization: true
  with_image: true

net:
  builder: models.FSOL.build_network
  kwargs:
    backbone:
      type: resnet50
      out_layers: [1, 2, 3]
      out_stride: 4
    pool:
      size: [3, 3]
    embed_dim: 256
    dropout: 0
    activation: leaky_relu
    initializer:
      method: normal
      std: 0.001
